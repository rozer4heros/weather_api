<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>초단기예보</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/datepicker.material.css" />
    <script src="datepicker.js"></script>
    <style>
      .alert {
        display: none;
      }
      .alert.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="../index.html">위로</a>
      <div>
        <h2>AI 생성 샘플</h2>
        <ul>
          <li><a href="chatgpt/index.html">ChatGPT</a></li>
          <li><a href="claude/index.html">Claude</a></li>
          <li><a href="copilot/index.html">Copilot</a></li>
          <li><a href="gemini/index.html">Gemini</a></li>
        </ul>
      </div>
    </div>
    <div class="container">
      <h1>초단기 예보</h1>
      <form action="" id="dateForm">
        <input type="text" id="datepicker" />
        <button>조회</button>
      </form>

      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">&num;</th>
            <th scope="col">일시</th>
            <th scope="col">시각</th>
            <th scope="col">온도</th>
            <th scope="col">습도</th>
          </tr>
        </thead>
        <tbody id="target">
          <tr>
            <td colspan="5">조회할 날짜를 입력하세요.</td>
          </tr>
        </tbody>
      </table>
      <div class="alert alert-danger" role="alert"></div>
    </div>
  </body>
  <script>
    const target = document.querySelector("#target");
    const datePicker = document.querySelector("#datepicker");
    const dateForm = document.querySelector("#dateForm");
    let datepicker = new Datepicker("#datepicker", {
      // 1 day in the past
      min: (() => {
        var date = new Date();
        date.setDate(date.getDate() - 2);
        return date;
      })(),
      // today
      max: (() => {
        var date = new Date();
        date.setDate(date.getDate());
        return date;
      })(),
    });
    let dateValue;

    dateForm.addEventListener("submit", e => {
      e.preventDefault();

      target.innerHTML = `<tr><td colspan="5">조회중입니다.</td></tr>`;
      hideMessage();

      console.log(datePicker.value);
      dateValue = datePicker.value
        .replace(/\./g, "") // . 제거
        .split(" ") // 공백을 기준으로 배열 변환
        // 연도면(i==0) 값을 그대로 사용, 아니라면(i!=) 두 자리로 늘려서(padStart(2,"0")) 사용
        .map((v, i) => (i === 0 ? v : v.padStart(2, "0")))
        .join(""); // 배열을 다시 문자열로 병합
      console.log(dateValue);

      inqueryShortTermWeather(dateValue);
    });

    function inqueryShortTermWeather(date) {
      fetch(
        `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=8a8963fa7a58dd6a5ff71a7355f4568c6a0ff183a2b571a580dfe30b6452154c&pageNo=1&numOfRows=1000&dataType=JSON&base_date=${date}&base_time=0500&nx=55&ny=127`,
      )
        .then(r => {
          console.log(r);
          if (!r.ok) {
            throw new Error("서버에 문제가 있습니다. 잠시 후 다시 시도해주세요.");
          }
          return r.json();
        }) // then에는 try의 기능이 포함되어 있다
        .then(result => {
          let data = result.response?.body?.items?.item;
          console.log(data);
          /*if (data == -1) {
            target.innerHTML = `<tr>
            <th scope="row" colspan="5">자료를 불러오는데 실패했습니다.</th></tr>`;
            return;
          }*/
          if (!data || data.length <= 0) {
            throw new Error("조회 결과가 없습니다.");
          }

          let dTMP = data.filter(d => d.category == "TMP"); // 온도
          let dREH = data.filter(d => d.category == "REH"); // 습도

          let tableData = "";
          dTMP.forEach((d, idx) => {
            // 데이터가 없으면 "-"
            let rehData = dREH[idx]?.fcstValue || "-";
            tableData += `<tr>
            <th scope="row">${idx + 1}</th>
            <td>${d.fcstDate}</td>
            <td>${d.fcstTime}</td>
            <td>${d.fcstValue}</td>
            <td>${rehData}</td>
          </tr>`;
          });
          target.innerHTML = tableData;
        })
        .catch(error => {
          console.log(error);
          showMessage(error);
          target.innerHTML = "";
          // target.innerHTML = `<tr><th scope="row" colspan="5">${error}</th></tr>`;
        });
    }

    // 인포창 띄우기
    const alertBox = document.querySelector(".alert");
    function showMessage(msg) {
      alertBox.classList.add("active");
      alertBox.textContent = msg;
    }
    function hideMessage() {
      alertBox.classList.remove("active");
    }
  </script>
</html>
