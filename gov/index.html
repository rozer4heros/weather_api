<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>초단기예보</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <a href="../index.html">위로</a>

    <div class="container">
      <h1>초단기 예보</h1>

      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">&num;</th>
            <th scope="col">일시</th>
            <th scope="col">시각</th>
            <th scope="col">온도</th>
            <th scope="col">습도</th>
          </tr>
        </thead>
        <tbody id="target">
          <!-- <tr>
            <th scope="row">${}</th>
            <td>${}</td>
            <td>${}</td>
          </tr> -->
        </tbody>
      </table>
    </div>
  </body>
  <script>
    fetch(
      `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=8a8963fa7a58dd6a5ff71a7355f4568c6a0ff183a2b571a580dfe30b6452154c&pageNo=1&numOfRows=1000&dataType=JSON&base_date=20260522&base_time=0500&nx=55&ny=127`,
    )
      .then(r => {
        console.log(r);
        return r.json();
      })
      .then(result => {
        let data = result.response.body.items.item;
        console.log(result.response.body.items.item);

        let dTMP = data.filter(d => d.category == "TMP");
        console.log(dTMP); // 온도
        let dREH = data.filter(d => d.category == "REH");
        console.log(dREH); // 습도
        let asdf;

        let tableData = "";
        dTMP.forEach((d, idx) => {
          // 데이터가 없으면 "-"
          let rehData = dREH[idx]?.fcstValue || "-";
          tableData += `<tr>
            <th scope="row">${idx + 1}</th>
            <td>${d.fcstDate}</td>
            <td>${d.fcstTime}</td>
            <td>${d.fcstValue}</td>
            <td>${rehData}</td>
          </tr>`;
        });
        target.innerHTML = tableData;
      });
  </script>
</html>
