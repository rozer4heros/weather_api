<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Weather Map</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <a href="/index.html">위로</a>

    <div class="container">
      <h1><span id="city">서울</span> 날씨 예보</h1>

      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">일시</th>
            <th scope="col">온도</th>
            <th scope="col">습도</th>
            <th scope="col">날씨</th>
          </tr>
        </thead>
        <tbody id="target">
          <!-- <tr>
            <th scope="row">일시</th>
            <td>온도</td>
            <td>습도</td>
            <td>날씨 아이콘</td>
          </tr> -->
        </tbody>
      </table>
    </div>

    <script>
      const target = document.querySelector("#target");

      function unixToDate(dt) {
        let time = new Date(dt * 1000);
        let yy = time.getFullYear() % 100;
        let mm = String(time.getMonth() + 1).padStart(2, "0");
        let dd = String(time.getDate()).padStart(2, "0");
        let hh = String(time.getHours()).padStart(2, "0");
        return `${yy}/${mm}/${dd} ${hh}시`;
      }

      fetch(
        "https://api.openweathermap.org/data/2.5/forecast?id=1835848&appid=adab1525c889f6a8468f20e35eef6381&units=metric",
      )
        .then(r => {
          console.log(r);
          return r.json(); // json -> js object 변환, 다음 then으로 전달
        })
        .then(result => {
          // https://openweathermap.org/payload/api/media/file/${result.list[i].weather[0].icon}.png
          console.log(result.list);
          let tableData = "";
          for (let i = 0; i < result.list.length; i++) {
            tableData += `<tr>
              <th scope="row">${unixToDate(result.list[i].dt)}</th>
              <td>${result.list[i].main.temp}ºC</td>
              <td>${result.list[i].main.humidity}%</td>
              <td><img src="https://openweathermap.org/payload/api/media/file/${result.list[i].weather[0].icon}.png"></img></td>
            </tr>`;
          }
          target.innerHTML = tableData;
        });
    </script>
  </body>
</html>
